name: learnloop

services:
  db:
    image: postgres:16-alpine
    container_name: learnloop-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-learn_loop}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-learn_loop}"]
      interval: 5s
      timeout: 5s
      retries: 5

  learnloop:
    build:
      context: .
      dockerfile: Dockerfile
    image: learnloop:latest
    container_name: learnloop-app
    restart: always
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:admin123@db:5432/learn_loop}
      - SECRET_KEY=${SECRET_KEY:-learn_loop_super_secret_jwt_key_2026_scholar_research}
      - SERVER_IP=${SERVER_IP:-10.147.20.160}
      - DOMAIN=${DOMAIN:-}
      - PORT=${PORT:-8000}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
