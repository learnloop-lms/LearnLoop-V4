stages:
  - build
  - test
  - deploy

variables:
  IMAGE_NAME: "learnloop-app"
  CONTAINER_NAME: "learnloop-container"

# ------------------------------------------------------------------------------
# Build Stage: Build the Docker image via Docker Compose
# ------------------------------------------------------------------------------
build:
  stage: build
  tags:
    - general-shell
  script:
    - echo "=== Building Learn Loop Docker Image ==="
    - docker compose build || docker-compose build
    - docker tag learnloop:latest ${IMAGE_NAME}:${CI_COMMIT_REF_NAME} || true
    - docker tag learnloop:latest ${IMAGE_NAME}:latest || true
    - echo "Build completed successfully."

# ------------------------------------------------------------------------------
# Test Stage: Container startup and healthcheck verification
# ------------------------------------------------------------------------------
test:
  stage: test
  tags:
    - general-shell
  script:
    - echo "=== Verifying Container Health ==="
    - docker run -d --name ${CONTAINER_NAME}-test -p 8001:8000 ${IMAGE_NAME}:${CI_COMMIT_REF_NAME}
    - sleep 5
    - curl -f http://localhost:8001/ || (docker logs ${CONTAINER_NAME}-test && exit 1)
    - docker rm -f ${CONTAINER_NAME}-test
    - echo "Container health check passed!"
  only:
    - main

# ------------------------------------------------------------------------------
# Deploy Stage: Run production container with Docker Compose
# ------------------------------------------------------------------------------
deploy:
  stage: deploy
  tags:
    - general-shell
  script:
    - echo "=== Starting Learn Loop Application with Docker Compose ==="
    - docker ps -q --filter "name=${CONTAINER_NAME}" | xargs -r docker rm -f || true
    - docker compose up -d --remove-orphans || docker-compose up -d --remove-orphans
    - sleep 5
    - docker compose ps || docker-compose ps
    - docker image prune -f
    - echo "=== Deployment Complete! Application started via Docker Compose ==="
  only:
    - main
