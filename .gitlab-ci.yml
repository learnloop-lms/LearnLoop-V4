stages:
  - build
  - test
  - deploy

variables:
  IMAGE_NAME: "learnloop-app"
  CONTAINER_NAME: "learnloop-container"

default:
  tags:
    - general-shell

# Build Stage: Build Docker image
build:
  stage: build
  script:
    - echo "=== Building Learn Loop Docker Image ==="
    - docker build -t "${IMAGE_NAME}:${CI_COMMIT_REF_SLUG}" -t "${IMAGE_NAME}:latest" .
    - echo "Build completed successfully."

# Deploy Stage: Run production container
deploy:
  stage: deploy
  script:
    - echo "=== Deploying Learn Loop Application ==="
    - docker rm -f "${CONTAINER_NAME}" 2>/dev/null || true
    - docker run -d --restart always --name "${CONTAINER_NAME}" -p 8000:8000 "${IMAGE_NAME}:${CI_COMMIT_REF_SLUG}"
    - docker image prune -f
    - docker ps --filter "name=^/${CONTAINER_NAME}$"
    - echo "=== Deployment Complete! Accessible at port 8000 ==="
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'