stages:
  - deploy

default:
  tags:
    - general-shell

# Deployment pipeline: builds and starts containers with latest versions
deploy:
  stage: deploy
  before_script:
    # 1. Inject .env from GitLab CI/CD Variables if configured
    - touch .env
    - |
      if [ -n "$DOTENV_FILE" ]; then
        echo "Injecting .env from GitLab CI/CD File variable (DOTENV_FILE)..."
        cp "$DOTENV_FILE" .env
      elif [ -n "$ENV_CONTENT" ]; then
        echo "Injecting .env from GitLab CI/CD Variable (ENV_CONTENT)..."
        echo "$ENV_CONTENT" > .env
      fi
  script:
    - echo "=== Pulling external service images (e.g. PostgreSQL) ==="
    - docker compose pull --ignore-buildable || true
    - echo "=== Building new container versions ==="
    - docker compose build
    - echo "=== Starting services with latest container versions ==="
    - docker compose up -d --force-recreate --remove-orphans
    - docker image prune -f
    - docker compose ps
    - echo "=== Deployment Complete ==="
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
